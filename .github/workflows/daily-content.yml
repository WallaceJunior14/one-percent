name: Daily content

on:
  # Disparo principal: agendador externo às 05:00 (ADR 0006, docs/ops/agendador-externo.md),
  # via workflow_dispatch com skip_if_published=true. O cron do GitHub atrasa horas (até 10 h
  # observadas) e fica como reserva: três horários em minutos "quebrados"; o primeiro disparo
  # que rodar publica o dia e os demais terminam sem trabalho (--skip-if-published).
  schedule:
    - cron: "17 3 * * *"
    - cron: "17 6 * * *"
    - cron: "17 9 * * *"
  workflow_dispatch:
    inputs:
      fake:
        description: "Usar resumos falsos (sem chamar o LLM, sem custo)"
        type: boolean
        default: false
      skip_if_published:
        description: "Não fazer nada se o dia de hoje já foi publicado (usado pelo agendador externo)"
        type: boolean
        default: false

permissions:
  contents: write # publicar no branch gh-pages

concurrency:
  group: daily-content
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      FAKE: ${{ github.event_name == 'workflow_dispatch' && inputs.fake }}
      SKIP_IF_PUBLISHED: ${{ github.event_name == 'workflow_dispatch' && inputs.skip_if_published }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/pyproject.toml

      - name: Install pipeline
        run: pip install -e pipeline

      - name: Require API key for real runs
        if: env.FAKE != 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::error::Secret ANTHROPIC_API_KEY não configurado (Settings > Secrets and variables > Actions > Secrets). Veja docs/adr/0005."
            exit 1
          fi

      - name: Check out published site (gh-pages)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin gh-pages > /dev/null; then
            git fetch --depth=1 origin gh-pages:gh-pages
            git worktree add site gh-pages
          else
            git worktree add --orphan -b gh-pages site
          fi

      - name: Generate content (up to 2 attempts)
        working-directory: pipeline
        env:
          # A chave só existe neste passo; o GitHub a mascara nos logs.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          args="run --out ../site"
          if [ "$FAKE" = "true" ]; then args="$args --fake"; fi
          if [ "${{ github.event_name }}" = "schedule" ] || [ "$SKIP_IF_PUBLISHED" = "true" ]; then
            args="$args --skip-if-published"
          fi

          # Códigos de saída do pipeline: 0 publicado; 1 falha temporária (repete);
          # 2 erro permanente, como chave inválida ou falta de créditos (não repete).
          for attempt in 1 2; do
            if python -m one_percent $args; then exit 0; else code=$?; fi
            if [ "$code" = 2 ]; then
              echo "::error::Erro permanente (chave, créditos ou permissão). Veja o log acima; sem nova tentativa."
              exit 2
            fi
            echo "::warning::Tentativa $attempt não publicou o dia."
            [ "$attempt" = 2 ] || sleep 300
          done
          exit 1

      - name: Publish to gh-pages
        working-directory: site
        run: |
          mkdir -p schemas
          cp ../contracts/daily-content.schema.json schemas/daily-content-v1.json
          touch .nojekyll
          git add -A
          if git diff --cached --quiet; then
            echo "Nada novo para publicar."
            exit 0
          fi
          git commit -m "content: $(jq -r .date latest.json)$([ "$FAKE" = "true" ] && echo ' (fake)')"
          git push origin gh-pages
