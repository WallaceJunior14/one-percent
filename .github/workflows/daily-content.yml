name: Daily content

on:
  # Disparo principal: agendador externo via workflow_dispatch (docs/ops/agendador-externo.md).
  # O cron do GitHub não garante horário e fica como reserva; com --skip-if-published, o
  # primeiro disparo que rodar publica o dia e os demais terminam sem trabalho.
  schedule:
    - cron: "17 3 * * *"
    - cron: "17 6 * * *"
    - cron: "17 9 * * *"
  workflow_dispatch:
    inputs:
      fake:
        description: "Usar resumos falsos (sem chamar o LLM, sem custo)"
        type: boolean
        default: false
      skip_if_published:
        description: "Não fazer nada se o dia de hoje já foi publicado (usado pelo agendador externo)"
        type: boolean
        default: false

# Sem permissões por padrão; cada job declara só o que precisa.
permissions: {}

concurrency:
  group: daily-content
  cancel-in-progress: false

env:
  FAKE: ${{ github.event_name == 'workflow_dispatch' && inputs.fake }}
  SKIP_IF_PUBLISHED: ${{ github.event_name == 'workflow_dispatch' && inputs.skip_if_published }}

jobs:
  # Processa conteúdo externo com a chave da API, sem poder escrever no repositório.
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.lock

      # Versões e hashes fixos: nenhuma dependência muda sem um commit.
      - name: Install locked dependencies
        run: pip install --require-hashes -r pipeline/requirements.lock

      - name: Require API key for real runs
        if: env.FAKE != 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::error::Secret ANTHROPIC_API_KEY não configurado (Settings > Secrets and variables > Actions > Secrets). Veja docs/adr/0005."
            exit 1
          fi

      - name: Download published site (gh-pages)
        run: |
          if git ls-remote --exit-code --heads "https://github.com/$GITHUB_REPOSITORY" gh-pages > /dev/null; then
            git clone --quiet --depth 1 --branch gh-pages "https://github.com/$GITHUB_REPOSITORY" site
            rm -rf site/.git
          else
            mkdir site
          fi

      - name: Generate content (up to 2 attempts)
        working-directory: pipeline
        env:
          # A chave só existe neste passo; o GitHub a mascara nos logs.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PYTHONPATH: src
        run: |
          args="run --out ../site"
          if [ "$FAKE" = "true" ]; then args="$args --fake"; fi
          if [ "${{ github.event_name }}" = "schedule" ] || [ "$SKIP_IF_PUBLISHED" = "true" ]; then
            args="$args --skip-if-published"
          fi

          # Códigos de saída: 0 publicado; 1 falha temporária (repete); 2 permanente (não repete).
          for attempt in 1 2; do
            if python -m one_percent $args; then exit 0; else code=$?; fi
            if [ "$code" = 2 ]; then
              echo "::error::Erro permanente (chave, créditos, permissão ou contrato). Veja o log acima; sem nova tentativa."
              exit 2
            fi
            echo "::warning::Tentativa $attempt não publicou o dia."
            [ "$attempt" = 2 ] || sleep 300
          done
          exit 1

      - name: Add schema and Pages marker
        run: |
          mkdir -p site/schemas
          cp contracts/daily-content.schema.json site/schemas/daily-content-v1.json
          touch site/.nojekyll

      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: site
          path: site
          include-hidden-files: true
          retention-days: 1

  # Só copia o site gerado para o gh-pages: não roda código do projeto nem de terceiros.
  publish:
    needs: generate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # push no branch gh-pages
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: gh-pages

      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: site
          path: ${{ runner.temp }}/site

      - name: Publish to gh-pages
        run: |
          rsync -a --delete --exclude .git "$RUNNER_TEMP/site/" ./
          git add -A
          if git diff --cached --quiet; then
            echo "Nada novo para publicar."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "content: $(jq -r .date latest.json)$([ "$FAKE" = "true" ] && echo ' (fake)')"
          git push origin gh-pages
