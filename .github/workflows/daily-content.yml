name: Daily content

on:
  schedule:
    - cron: "0 8 * * *" # 05:00 em Brasília; 2 h de folga para o prazo das 7 h (RF-001)
  workflow_dispatch:
    inputs:
      fake:
        description: "Usar resumos falsos (sem chamar o LLM, sem custo)"
        type: boolean
        default: false

permissions:
  contents: write # publicar no branch gh-pages
  id-token: write # token OIDC do GitHub para a federação com a Anthropic (ADR 0004)

concurrency:
  group: daily-content
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      FAKE: ${{ github.event_name == 'workflow_dispatch' && inputs.fake }}
      # Federação de identidade (ADR 0004): ids não secretos, em Settings > Variables > Actions.
      # Não defina ANTHROPIC_API_KEY neste workflow: mesmo vazia, ela tem prioridade sobre a
      # federação no SDK.
      ANTHROPIC_FEDERATION_RULE_ID: ${{ vars.ANTHROPIC_FEDERATION_RULE_ID }}
      ANTHROPIC_ORGANIZATION_ID: ${{ vars.ANTHROPIC_ORGANIZATION_ID }}
      ANTHROPIC_SERVICE_ACCOUNT_ID: ${{ vars.ANTHROPIC_SERVICE_ACCOUNT_ID }}
      ANTHROPIC_WORKSPACE_ID: ${{ vars.ANTHROPIC_WORKSPACE_ID }}
      ANTHROPIC_IDENTITY_TOKEN_FILE: ${{ runner.temp }}/oidc/anthropic-jwt
      OIDC_AUDIENCE: https://api.anthropic.com
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/pyproject.toml

      - name: Install pipeline
        run: pip install -e pipeline

      - name: Require federation settings for real runs
        if: env.FAKE != 'true'
        run: |
          missing=""
          for name in ANTHROPIC_FEDERATION_RULE_ID ANTHROPIC_ORGANIZATION_ID \
                      ANTHROPIC_SERVICE_ACCOUNT_ID ANTHROPIC_WORKSPACE_ID; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::Variables não configuradas:$missing (Settings > Secrets and variables > Actions > Variables). Veja docs/adr/0004."
            exit 1
          fi

      - name: Check out published site (gh-pages)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin gh-pages > /dev/null; then
            git fetch --depth=1 origin gh-pages:gh-pages
            git worktree add site gh-pages
          else
            git worktree add --orphan -b gh-pages site
          fi

      - name: Generate content (up to 2 attempts)
        working-directory: pipeline
        run: |
          unset ANTHROPIC_API_KEY ANTHROPIC_AUTH_TOKEN
          args="run --out ../site"

          if [ "$FAKE" = "true" ]; then
            args="$args --fake"
          else
            # O token do GitHub vale ~5 min e cada um só pode ser trocado uma vez; o acesso da
            # Anthropic dura no máximo o dobro do tempo restante dele. Um token novo a cada 60 s
            # garante que o SDK sempre encontre um token não usado quando renovar o acesso.
            mkdir -p "$(dirname "$ANTHROPIC_IDENTITY_TOKEN_FILE")"
            fetch_token() {
              curl -sSf -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
                "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$OIDC_AUDIENCE" \
                | jq -er .value > "$ANTHROPIC_IDENTITY_TOKEN_FILE.tmp" \
                && mv "$ANTHROPIC_IDENTITY_TOKEN_FILE.tmp" "$ANTHROPIC_IDENTITY_TOKEN_FILE"
            }
            fetch_token
            ( while sleep 60; do fetch_token || echo "::warning::Falha ao renovar o token OIDC."; done ) &
            refresher=$!
            trap 'kill $refresher 2>/dev/null; rm -f "$ANTHROPIC_IDENTITY_TOKEN_FILE"' EXIT
          fi

          for attempt in 1 2; do
            if python -m one_percent $args; then exit 0; fi
            echo "::warning::Tentativa $attempt não publicou o dia."
            [ "$attempt" = 2 ] || sleep 300
          done
          exit 1

      - name: Publish to gh-pages
        working-directory: site
        run: |
          mkdir -p schemas
          cp ../contracts/daily-content.schema.json schemas/daily-content-v1.json
          touch .nojekyll
          git add -A
          if git diff --cached --quiet; then
            echo "Nada novo para publicar."
            exit 0
          fi
          git commit -m "content: $(jq -r .date latest.json)$([ "$FAKE" = "true" ] && echo ' (fake)')"
          git push origin gh-pages
