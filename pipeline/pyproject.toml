[project]
name = "one-percent-pipeline"
version = "0.1.0"
description = "Pipeline diário que coleta, resume e publica o conteúdo do app 1% ao Dia."
requires-python = ">=3.12"
dependencies = [
  "anthropic>=0.70",
  "defusedxml>=0.7",
  "feedparser>=6.0",
  "httpx>=0.27",
  "jsonschema>=4.23",
  "pydantic>=2.9",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.13",
  "pytest>=8.3",
  "ruff>=0.8",
  "types-defusedxml",
  "types-jsonschema",
  "types-PyYAML",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/one_percent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["one_percent"]
